name: Feature request
description: Request a feature and help improve the plugin
title: "[FR] Short description of the feature"
labels: enhancement
assignees: mnaoumov
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the feature request. Include any relevant details.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Details
      description: Provide a step-by-step description.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Notice that '...'
        ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired Behavior
      description: What do you want to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current Behavior
      description: What actually happens?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version of the plugin you are using.
      placeholder: 1.0.0
  - type: textarea
    attributes:
      label: Attachments
      description: Optional, but strongly encouraged. Attach a video showing the current behavior and a sample vault where the feature could be applied. They help the maintainer understand the request and speed up the implementation.
      placeholder: Drag and drop files here.
  - type: checkboxes
    attributes:
      label: Confirmations
      description: Ensure the following conditions are met
      options:
        - label: I have tested the absence of the requested feature with the latest version of the plugin
          required: true
        - label: I have checked GitHub for existing Feature Requests
          required: true
