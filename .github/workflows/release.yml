name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Checks the tag is the manifest version, builds, archives `demo-vault/`, publishes the release and attests its
    # Assets.
    uses: mnaoumov/obsidian-dev-toolkit/.github/workflows/obsidian-plugin-release.yml@3.0.0
    with:
      package-manager: npm
